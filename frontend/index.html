<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobFit AI - Resume Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1em;
        }
        
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        input[type="file"]:hover {
            background: #e8edff;
            border-color: #764ba2;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
            margin-top: 30px;
        }
        
        .results.active {
            display: block;
        }
        
        .score-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .score-number {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
        }
        
        .score-label {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
        }
        
        .summary {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }
        
        .summary p {
            color: #333;
            line-height: 1.6;
            font-size: 1.05em;
        }
        
        .skills-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        
        .skills-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .skill-tag {
            display: inline-block;
            padding: 8px 15px;
            background: #e8edff;
            color: #667eea;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9em;
        }
        
        .missing {
            background: #ffe8e8;
            color: #d32f2f;
        }
        
        .improvements-section h3 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .improvement {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #764ba2;
        }
        
        .improvement h4 {
            color: #764ba2;
            margin-bottom: 10px;
        }
        
        .improvement p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .improvement .example {
            background: #f8f9ff;
            padding: 12px;
            border-radius: 5px;
            font-style: italic;
            color: #333;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 JobFit AI</h1>
            <p>Analyze your resume against job postings with AI-powered insights</p>
        </div>
        
        <div class="content">
            <form id="form">
                <div class="form-group">
                    <label for="resume">�� Upload Your Resume (PDF)</label>
                    <input type="file" id="resume" accept="application/pdf" required />
                </div>
                
                <div class="form-group">
                    <label for="job_text">📋 Job Description</label>
                    <textarea 
                        id="job_text" 
                        placeholder="Paste the job description here...

Example: Looking for a Software Engineer with 5+ years experience in Python, FastAPI, Docker, and AWS. Must have strong problem-solving skills and experience with microservices architecture."
                        required
                    ></textarea>
                </div>
                
                <button type="submit" id="submitBtn">
                    Analyze Resume
                </button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing your resume... This may take a few seconds.</p>
            </div>
            
            <div class="results" id="results"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
